<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>strata-graph demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bar: #f5f5f4;
        --line: #d6d3d1;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bar: #292524;
          --line: #44403c;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --accent: #60a5fa;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        background: var(--bar);
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
      }
      footer {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        color: var(--muted);
        justify-content: space-between;
      }
      header .group {
        display: flex;
        gap: 4px;
        align-items: center;
        padding-right: 8px;
        border-right: 1px solid var(--line);
      }
      header .group:last-child {
        border-right: 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .palette {
        cursor: grab;
      }
      main {
        position: relative;
        min-height: 0;
      }
      #canvas {
        position: absolute;
        inset: 0;
      }
      #minimap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      .hint {
        color: var(--muted);
      }
    </style>
    <script src="../vendor/d3/d3.min.js"></script>
    <script type="module" src="./graph-demo.js"></script>
  </head>
  <body>
    <header>
      <div class="group" aria-label="Add">
        <span class="hint">Drag in:</span>
        <button class="palette" draggable="true" data-shape="box">Service</button>
        <button class="palette" draggable="true" data-shape="cylinder">Database</button>
        <button class="palette" draggable="true" data-shape="queue">Queue</button>
        <button class="palette" draggable="true" data-shape="person">Client</button>
        <button class="palette" draggable="true" data-shape="cloud">External</button>
        <button class="palette" draggable="true" data-shape="sticky">Note</button>
      </div>
      <div class="group">
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      </div>
      <div class="group">
        <label
          >Routing
          <select id="routing">
            <option>orthogonal</option>
            <option>straight</option>
            <option>curved</option>
          </select></label
        >
        <button id="theme">Dark</button>
        <label><input type="checkbox" id="readonly" /> Read-only</label>
      </div>
      <div class="group">
        <button id="align-left">Align left</button>
        <button id="align-top">Align top</button>
        <button id="distribute">Distribute</button>
      </div>
      <div class="group">
        <button id="fit">Fit</button>
        <button id="zoom-sel">Zoom to selection</button>
        <button id="heat">Heatmap</button>
        <button id="svg">SVG</button>
        <button id="png">PNG</button>
      </div>
    </header>
    <main>
      <div id="canvas"></div>
      <div id="minimap"></div>
    </main>
    <footer>
      <span id="status">Ready</span>
      <span class="hint"
        >Drag from a port to connect · Space+drag to pan · Ctrl+wheel to zoom · Delete removes ·
        double-click renames</span
      >
    </footer>
  </body>
</html>
