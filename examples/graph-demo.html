<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>strata-graph demo</title>
    <link rel="stylesheet" href="./graph-demo.css" />
    <script src="../vendor/d3/d3.min.js"></script>
    <script type="module" src="./graph-demo.js"></script>
  </head>
  <body>
    <header>
      <div class="group" aria-label="Add">
        <span class="hint">Drag in:</span>
        <button class="palette" draggable="true" data-shape="box">Service</button>
        <button class="palette" draggable="true" data-shape="cylinder">Database</button>
        <button class="palette" draggable="true" data-shape="queue">Queue</button>
        <button class="palette" draggable="true" data-shape="person">Client</button>
        <button class="palette" draggable="true" data-shape="cloud">External</button>
        <button class="palette" draggable="true" data-shape="sticky">Note</button>
      </div>
      <div class="group">
        <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      </div>
      <div class="group">
        <label
          >Routing
          <select id="routing">
            <option>orthogonal</option>
            <option>straight</option>
            <option>curved</option>
          </select></label
        >
        <button id="theme">Dark</button>
        <label><input type="checkbox" id="readonly" /> Read-only</label>
      </div>
      <div class="group">
        <button id="align-left">Align left</button>
        <button id="align-top">Align top</button>
        <button id="distribute">Distribute</button>
      </div>
      <div class="group">
        <button id="fit">Fit</button>
        <button id="zoom-sel">Zoom to selection</button>
        <button id="heat">Heatmap</button>
        <button id="svg">SVG</button>
        <button id="png">PNG</button>
      </div>
    </header>
    <main>
      <div id="canvas"></div>
      <div id="minimap"></div>
    </main>
    <footer>
      <span id="status">Ready</span>
      <span class="hint"
        >Drag from a port to connect · Space+drag to pan · Ctrl+wheel to zoom · Delete removes ·
        double-click renames</span
      >
    </footer>
  </body>
</html>
